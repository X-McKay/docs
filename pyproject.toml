[project]
name = "agent-playbook-workspace"
version = "0.1.0"
description = "Reproducible workspace for the Agent Playbook and agentctl"
requires-python = ">=3.12,<3.15"
dependencies = ["agentctl-playbook"]

[dependency-groups]
dev = ["ruff==0.16.9"]

[tool.uv]
package = false

[tool.uv.sources]
agentctl-playbook = { workspace = true }

[tool.uv.workspace]
members = ["tools/agentctl"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TRY"]
ignore = ["E501", "TRY003"]
